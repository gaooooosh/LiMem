[project]
name = "limem"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dashscope>=1.25,<2",
    "fastapi>=0.116,<1",
    "jieba>=0.42,<1",
    "openai>=1.97,<2",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.35,<1",
    "torch==2.6.0",
    "transformers==4.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
