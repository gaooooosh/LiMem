services:
  limem:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LIMEM_BIND_HOST:-127.0.0.1}:${LIMEM_PORT:-8012}:8000"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
      - type: bind
        source: ./var
        target: /app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
